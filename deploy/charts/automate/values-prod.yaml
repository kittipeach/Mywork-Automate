# PROD overrides.
# Local auth is OFF (docs/spec/07 §1.2 — hard requirement; policy check + runtime
# guard both enforce). Postgres/Temporal are external (managed/shared).

app:
  env: prod
  fileStore: azureblob
  authLocalEnabled: "false"
  databaseUrl: "postgres://REPLACE_ME@automate-prod.postgres.database.azure.com:5432/automate?sslmode=require"
  temporalHostPort: "temporal-prod.internal:7233"

api:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

worker:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  className: nginx
  host: automate.mywork.example.com
  tls:
    - hosts:
        - automate.mywork.example.com
      secretName: automate-prod-tls

networkPolicy:
  enabled: true

postgres:
  enabled: false

temporal:
  enabled: false
