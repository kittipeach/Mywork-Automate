apiVersion: v1
kind: Service
metadata:
  name: {{ include "automate.api.fullname" . }}
  labels:
    {{- include "automate.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "automate.componentSelectorLabels" (dict "root" . "component" "api") | nindent 4 }}
