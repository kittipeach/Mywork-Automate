# golangci-lint config for MyWork Automate.
run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - gofmt
    - goimports
    - misspell
    - bodyclose
    - noctx
    - errorlint      # enforces fmt.Errorf %w wrapping (CLAUDE.md rule)
    - gosec          # security linter (banking-grade)

issues:
  exclude-rules:
    # test files may use fmt.Sprintf without wrapping and table-driven closures
    - path: _test\.go
      linters:
        - gosec
        - noctx
  max-issues-per-linter: 0
  max-same-issues: 0

linters-settings:
  goimports:
    local-prefixes: github.com/mywork/automate
